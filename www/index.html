<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com http://localhost:3000 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
    <title>Student Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-modal" class="modal-overlay">
        <div class="modal-card">
            <h2>Student Login</h2>
            <div id="login-alert" class="alert danger hidden"></div>
            <form id="login-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="login-id">Student ID</label>
                    <input type="text" id="login-id" placeholder="e.g. 20210001" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" required>
                </div>
                <button type="button" id="btn-login" class="btn primary">Login</button>
            </form>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <header>
            <h1>Student Profile</h1>
            <nav>
                <a href="#profile">Profile</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
                <button id="btn-logout" class="btn danger nav-btn">Logout</button>
            </nav>
        </header>
        <main class="container">
            <section id="profile" class="card">
                <div class="profile-header">
                    <div class="avatar-container">
                        <img src="img/avatar.png" alt="Profile Picture" class="avatar" id="display-avatar">
                        <button id="btn-change-photo" class="btn-photo-overlay" title="Change Profile Picture">
                            📷
                        </button>
                    </div>
                    <div class="profile-info">
                        <h2 id="display-fullname">Loading...</h2>
                        <p class="subtitle" id="display-course">Loading...</p>
                        <span class="badge" id="display-year">Loading...</span>
                    </div>
                </div>
                <div class="button-group">
                    <button id="btn-edit-profile" class="btn primary">Edit Profile</button>
                    <button id="btn-camera" class="btn secondary">Change Profile Picture</button>
                </div>
                <div id="camera-alert" class="alert hidden"></div>
            </section>
            <section id="edit-profile-modal" class="card hidden">
                <h2>Edit Profile</h2>
                <div id="validation-alert" class="alert hidden"></div>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="input-fullname">Full Name *</label>
                        <input type="text" id="input-fullname" placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label for="input-course">Course *</label>
                        <input type="text" id="input-course" placeholder="e.g., BS Information Technology">
                    </div>
                    <div class="form-group">
                        <label for="input-year">Year Level *</label>
                        <select id="input-year">
                            <option value="">Select Year Level</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-about">About Me *</label>
                        <textarea id="input-about" rows="4" placeholder="Tell us about yourself..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="input-skills">Skills (Comma-separated) *</label>
                        <input type="text" id="input-skills" placeholder="e.g., JavaScript, HTML/CSS, Cordova">
                    </div>
                    <div class="form-actions">
                        <button type="button" id="btn-save" class="btn primary">Save Changes</button>
                        <button type="button" id="btn-cancel" class="btn secondary">Cancel</button>
                    </div>
                </form>
            </section>
            <section id="about" class="card">
                <h3>About Me</h3>
                <p id="display-about">Loading about information...</p>
            </section>
            <section id="skills" class="card">
                <h3>Skills</h3>
                <ul id="display-skills" class="skills-list"></ul>
            </section>
            <section id="projects" class="card">
                <h3>Projects</h3>
                <p>Activity 1 to Activity 7 - Mobile Application Development</p>
            </section>
            <section id="contact" class="card">
                <h3>Contact Me</h3>
                <p>Email: <a href="mailto:20240031364@my.xu.edu.ph">20240031364@my.xu.edu.ph</a></p>
            </section>
        </main>
    </div>
    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
